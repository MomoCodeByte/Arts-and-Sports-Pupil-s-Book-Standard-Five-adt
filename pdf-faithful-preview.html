<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arts and Sports Standard Five - Converted book preview</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e5e7eb; color: #111827; overflow: hidden; }
    header {
      height: 56px; display: flex; align-items: center; gap: 12px;
      padding: 8px 16px; background: #fff; border-bottom: 1px solid #cbd5e1;
    }
    h1 { margin: 0 auto 0 0; font-size: 17px; }
    button {
      height: 36px; border: 1px solid #94a3b8; border-radius: 7px;
      background: #fff; padding: 0 12px; font: inherit;
    }
    button { cursor: pointer; font-weight: 700; }
    button:hover { background: #f1f5f9; }
    .page-count { white-space: nowrap; }
    iframe { display: block; width: 100%; height: calc(100vh - 56px); border: 0; background: #525659; }
    @media (max-width: 650px) {
      header { padding: 8px; gap: 6px; }
      h1 { font-size: 13px; }
      button { padding: 0 9px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Arts and Sports Pupil's Book - Converted HTML view</h1>
    <button id="previous" type="button" aria-label="Previous book section">Previous</button>
    <span class="page-count">Section <strong id="page">1</strong> / <strong id="total">…</strong></span>
    <button id="next" type="button" aria-label="Next book section">Next</button>
  </header>
  <iframe id="book" title="Arts and Sports converted textbook" src="index.html"></iframe>
  <script>
    const frame = document.getElementById('book');
    const pageLabel = document.getElementById('page');
    const totalLabel = document.getElementById('total');
    const previousButton = document.getElementById('previous');
    const nextButton = document.getElementById('next');
    let sections = [];
    let currentIndex = 0;

    function showSection(value) {
      if (!sections.length) return;
      currentIndex = Math.max(0, Math.min(sections.length - 1, Number(value) || 0));
      pageLabel.textContent = currentIndex + 1;
      frame.src = sections[currentIndex].href;
      previousButton.disabled = currentIndex === 0;
      nextButton.disabled = currentIndex === sections.length - 1;
    }

    previousButton.addEventListener('click', () => showSection(currentIndex - 1));
    nextButton.addEventListener('click', () => showSection(currentIndex + 1));

    fetch('content/pages.json')
      .then(response => {
        if (!response.ok) throw new Error(`Could not load pages (${response.status})`);
        return response.json();
      })
      .then(items => {
        sections = items.filter(item => item && item.href);
        totalLabel.textContent = sections.length;
        showSection(0);
      })
      .catch(error => {
        totalLabel.textContent = '1';
        console.error(error);
      });
  </script>
</body>
</html>
