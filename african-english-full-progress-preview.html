<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full-book African English production preview</title>
  <style>
    body { margin: 0; background: #eaf5ee; color: #173b24; font-family: Arial, sans-serif; }
    main { width: min(720px, calc(100% - 36px)); margin: 30px auto; }
    header, article { background: white; border-radius: 16px; padding: 22px; margin-bottom: 14px; box-shadow: 0 8px 24px #173b2418; }
    header { border-top: 7px solid #168347; }
    h1 { margin: 0 0 8px; }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }
    p { line-height: 1.55; }
    audio { width: 100%; }
    .status { display: inline-block; padding: 6px 12px; border-radius: 99px; background: #d7f3e1; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>African English full-book preview</h1>
      <p class="status">Generation active: 2 of 112 pages ready</p>
      <p>Accent strength 55%; speed 0.95. More pages will appear after the production pass completes.</p>
    </header>
    <article><h2>Physical page 1</h2><audio controls preload="metadata" src="audio-samples/african-english/page-001-sample.wav"></audio></article>
    <article><h2>Physical page 2</h2><audio controls preload="metadata" src="audio-samples/african-english/page-002-sample.wav"></audio></article>
  </main>
</body>
</html>
